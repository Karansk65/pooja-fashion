services:
  - type: web
    name: pooja-fashion
    runtime: node
    buildCommand: npm --prefix backend install
    startCommand: npm start
    disk:
      name: pooja-fashion-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DATABASE_FILE
        value: /var/data/pooja-fashion.json
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
