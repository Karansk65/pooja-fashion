services:
  - type: web
    name: pooja-fashion
    runtime: node
    buildCommand: npm --prefix backend install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DATABASE_FILE
        value: ./data/pooja-fashion.json
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMS_PROVIDER
        value: fast2sms
      - key: FAST2SMS_API_KEY
        sync: false
