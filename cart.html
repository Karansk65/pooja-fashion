<!DOCTYPE html>
<html>
<head>
  <title>Cart | Pooja Fashion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">Pooja Fashion</div>
</header>

<section class="cart-page">
  <h1>Your Cart</h1>

  <div id="cartItems"></div>

  <h2>Total: <span id="cartTotal">₹0</span></h2>
  <div class="order-summary">
<div class="coupon-box">
  <input type="text" id="couponCode" placeholder="Enter Coupon Code">
  <button onclick="applyCoupon()">Apply</button>
</div>
  <h2>Order Summary</h2>

  <div class="summary-row">
    <span>Products Total</span>
    <span id="productsTotal">₹0</span>
  </div>

  <div class="summary-row">
    <span>Shipping</span>
    <span>FREE</span>
  </div>

  <div class="summary-row">
    <span>Discount</span>
    <span id="discountAmount">₹500</span>
  </div>

  <hr>

  <div class="summary-row total-row">
    <span>Final Total</span>
    <span id="finalTotal">₹0</span>
  </div>

</div>

  <div class="checkout-form">
    <h2>Customer Details</h2>

    <input type="text" id="customerName" placeholder="Full Name">
    <input type="tel" id="customerPhone" placeholder="Mobile Number">
    <textarea id="customerAddress" placeholder="Full Address"></textarea>
    <select id="paymentMethod">

  <select id="paymentMethod">
  <option value="">Select Payment Method</option>

  <option value="PhonePe">🟣 PhonePe</option>
  <option value="Google Pay">🔵 Google Pay</option>
  <option value="Paytm">🔷 Paytm</option>
  <option value="UPI">💳 Any UPI App</option>

  <option value="Visa Card">💳 Visa Card</option>
  <option value="Master Card">💳 Master Card</option>
  <option value="RuPay Card">💳 RuPay Card</option>

  <option value="Net Banking">🏦 Net Banking</option>

  <option value="Cash On Delivery">📦 Cash On Delivery</option>
</select>

    <button onclick="placeOrder()">Place Order</button>
  </div>
</section>

<script src="cart.js"></script>
</body>
</html>
